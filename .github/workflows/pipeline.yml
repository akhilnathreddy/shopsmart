name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  # ==========================================
  # PHASE 1: Testing
  # ==========================================
  test-client:
    name: Client Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --exclude 'src/__test__/**' --reporter=junit --outputFile.junit=test-results/unit.xml
      - run: npx vitest run --dir src/__test__ --reporter=junit --outputFile.junit=test-results/integration.xml
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-results
          path: client/test-results/

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm install --save-dev jest-junit
      - run: npm run lint
      - run: npx jest --testPathIgnorePatterns=tests/integration --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: unit.xml
      - run: npx jest tests/integration --reporters=default --reporters=jest-junit --forceExit
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: integration.xml
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/test-results/

  # ==========================================
  # PHASE 2: Infrastructure Provisioning
  # ==========================================
  terraform:
    name: Terraform Apply
    needs: [test-client, test-server]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      client_repo: ${{ steps.tf-outputs.outputs.client_repo }}
      server_repo: ${{ steps.tf-outputs.outputs.server_repo }}
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}
      client_service: ${{ steps.tf-outputs.outputs.client_service }}
      server_service: ${{ steps.tf-outputs.outputs.server_service }}
      client_task_family: ${{ steps.tf-outputs.outputs.client_task_family }}
      server_task_family: ${{ steps.tf-outputs.outputs.server_task_family }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Cache Terraform State
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.sha }}
          restore-keys: |
            terraform-state-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - run: terraform init
      - run: terraform validate
      - run: terraform plan
      - run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          echo "client_repo=$(terraform output -raw client_repo_name)" >> $GITHUB_OUTPUT
          echo "server_repo=$(terraform output -raw server_repo_name)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "client_service=$(terraform output -raw client_service_name)" >> $GITHUB_OUTPUT
          echo "server_service=$(terraform output -raw server_service_name)" >> $GITHUB_OUTPUT
          echo "client_task_family=$(terraform output -raw client_task_family)" >> $GITHUB_OUTPUT
          echo "server_task_family=$(terraform output -raw server_task_family)" >> $GITHUB_OUTPUT

  # ==========================================
  # PHASE 3: Build, Push & Deploy to ECS
  # ==========================================
  deploy:
    name: Build, Push & Deploy
    needs: [terraform]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push client image
        id: build-client
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.terraform.outputs.client_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f client/Dockerfile client/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "client_image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push server image
        id: build-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.terraform.outputs.server_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f server/Dockerfile server/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "server_image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download client task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ needs.terraform.outputs.client_task_family }} --query taskDefinition > client-task-def.json

      - name: Fill in the new image ID in the client task definition
        id: task-def-client
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: client-task-def.json
          container-name: shopsmart-client
          image: ${{ steps.build-client.outputs.client_image }}

      - name: Deploy client to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-client.outputs.task-definition }}
          service: ${{ needs.terraform.outputs.client_service }}
          cluster: ${{ needs.terraform.outputs.cluster_name }}
          wait-for-service-stability: true

      - name: Download server task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ needs.terraform.outputs.server_task_family }} --query taskDefinition > server-task-def.json

      - name: Fill in the new image ID in the server task definition
        id: task-def-server
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: server-task-def.json
          container-name: shopsmart-server
          image: ${{ steps.build-server.outputs.server_image }}

      - name: Deploy server to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-server.outputs.task-definition }}
          service: ${{ needs.terraform.outputs.server_service }}
          cluster: ${{ needs.terraform.outputs.cluster_name }}
          wait-for-service-stability: true

      - name: Fetch ECS Service Events and Logs on Failure
        if: failure()
        run: |
          echo "=== Client ECS Service Events ==="
          aws ecs describe-services --cluster ${{ needs.terraform.outputs.cluster_name }} --services ${{ needs.terraform.outputs.client_service }} --query 'services[0].events[0:10].message' --output text || true
          
          echo "=== Client CloudWatch Logs ==="
          aws logs filter-log-events --log-group-name "/ecs/${{ needs.terraform.outputs.client_repo }}" --limit 50 --query 'events[*].message' --output text || true

          echo "=== Server ECS Service Events ==="
          aws ecs describe-services --cluster ${{ needs.terraform.outputs.cluster_name }} --services ${{ needs.terraform.outputs.server_service }} --query 'services[0].events[0:10].message' --output text || true
          
          echo "=== Server CloudWatch Logs ==="
          aws logs filter-log-events --log-group-name "/ecs/${{ needs.terraform.outputs.server_repo }}" --limit 50 --query 'events[*].message' --output text || true
